name: Publish New Version

on:
   pull_request:
      types: [closed]
      branches: [master]

jobs:
   bump-package-version:
      # Only run if the PR closed by merging
      if: github.event.pull_request.merged
      runs-on: ubuntu-latest
      steps:
         # We need a App Token here to commit, ignoring the branch protection rules
         - name: Generate a token
           id: generate-token
           uses: actions/create-github-app-token@v2
           with:
              app-id: ${{ vars.GS_DEV_APP_ID }}
              private-key: ${{ secrets.GS_DEV_APP_PK }}

         - name: Checkout Master
           uses: actions/checkout@v5
           with:
              ref: master
              token: ${{ steps.generate-token.outputs.token }}

         - name: Bump package.json Version
           id: bump_version
           uses: copapow/version-bump-package@v1
           with:
              github_token: ${{ secrets.GITHUB_TOKEN }}

         - name: Commit the new version
           id: commit_version
           uses: EndBug/add-and-commit@v9
           with:
              message: "Bump package version (from GitHub Actions Workflow)"
              tag: ${{ steps.bump_version.outputs.new_version }}

         - name: Create release on GitHub
           uses: ncipollo/release-action@v1
           with:
              tag: ${{ steps.bump_version.outputs.new_version }}
              body: ${{ github.event.pull_request.body }}
              token: ${{ secrets.GITHUB_TOKEN }}

         - name: Set up Node.js for NPM
           uses: actions/setup-node@v4
           with:
              registry-url: "https://registry.npmjs.org"

         - name: Publish package to NPM
           run: npm publish --access public
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

         - name: Trigger Dependabot updates in dependent repos
           if: success()
           run: |
              # Trigger Dependabot updates in dependent repositories
              # This uses the GitHub API to trigger repository_dispatch events
              # which can be listened to by workflows in dependent repos
              # Format: owner/repo (comma-separated list)
              # Example: "CruGlobal/repo1,CruGlobal/repo2,CruGlobal/repo3"

              DEPENDENT_REPOS="${{ vars.DEPENDENT_REPOS || '' }}"

              if [ -z "$DEPENDENT_REPOS" ]; then
                 echo "ℹ️  No dependent repositories configured. Set DEPENDENT_REPOS variable to enable automatic Dependabot triggers."
                 echo "   Format: owner/repo1,owner/repo2,owner/repo3"
                 exit 0
              fi

              NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
              PACKAGE_NAME="@digiserve/ab-utils"

              echo "📦 New version published: $PACKAGE_NAME@$NEW_VERSION"
              echo "🔄 Triggering Dependabot updates in dependent repositories..."

              # Split by comma and process each repo
              IFS=',' read -ra REPOS <<< "$DEPENDENT_REPOS"
              for repo in "${REPOS[@]}"; do
                 # Trim whitespace
                 repo=$(echo "$repo" | xargs)
                 
                 if [ -z "$repo" ]; then
                    continue
                 fi
                 
                 echo "  → Triggering update in $repo..."
                 
                 # Use repository_dispatch to trigger workflows in dependent repos
                 # Dependent repos can listen for this event with:
                 # on:
                 #   repository_dispatch:
                 #     types: [dependabot-update]
                 RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$repo/dispatches" \
                    -d "{\"event_type\":\"dependabot-update\",\"client_payload\":{\"package\":\"$PACKAGE_NAME\",\"version\":\"$NEW_VERSION\",\"source_repo\":\"${{ github.repository }}\"}}")
                 
                 HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                 BODY=$(echo "$RESPONSE" | sed '$d')
                 
                 if [ "$HTTP_CODE" -eq 204 ]; then
                    echo "    ✅ Successfully triggered update in $repo"
                 else
                    echo "    ⚠️  Failed to trigger update in $repo (HTTP $HTTP_CODE)"
                    echo "    Response: $BODY"
                 fi
              done

              echo "✨ Finished triggering Dependabot updates"
